name: crave-food-delivery

services:
  redis:
    image: redis:7-alpine
    container_name: crave-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # CR-012: No secrets in build args - injected at runtime via env_file
    container_name: crave-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WS_PORT: 8000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    command: ['node', 'ws-server.js']
    # CR-015: WebSocket port kept internal (not published to host)
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const r=http.get('http://localhost:8000/__ws/broadcast',{timeout:5000},(res)=>{process.exit(res.statusCode<500?0:1)});r.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # CR-012: No secrets in build args - injected at runtime via env_file
    container_name: crave-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      WS_PORT: 8000
      WS_HOST: backend
      WS_BROADCAST_PORT: 8000
      WS_BROADCAST_HOST: backend
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_WS_PORT: 8000
      NEXT_PUBLIC_WS_HOST: backend
    command: ['node', 'server.js']
    # CR-015: Only expose public HTTP port
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const r=http.get('http://localhost:3000/api/health',{timeout:3000},(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  redis_data:
