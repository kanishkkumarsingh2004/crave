name: crave-food-delivery

services:
  # ─── 1. Backend WebSocket Real-Time Server ─────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crave-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WS_PORT: 8000
      REDIS_DISABLED: 'true'
    command: ['node', 'ws-server.js']
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const r=http.get('http://localhost:8000/health',{timeout:5000},(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crave-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ─── 2. Frontend Next.js Web App & WebSocket Proxy ────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crave-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 8000
      WS_HOST: backend
      WS_BROADCAST_PORT: 8000
      WS_BROADCAST_HOST: backend
      REDIS_DISABLED: 'true'
    command: ['node', 'server.js']
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const r=http.get('http://localhost:3000/api/health',{timeout:5000},(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - crave-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  crave-network:
    name: crave-network
    driver: bridge
