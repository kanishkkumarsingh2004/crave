name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '12.3.4'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: TypeScript check
        run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crave_test
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d crave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          WS_INTERNAL_SECRET: test-internal-secret

  load-test:
    name: Load Test (Concurrent Users)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build

      - name: Create CI environment file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          JWT_SECRET=test-jwt-secret-for-ci-load-test
          DATABASE_URL=postgresql://test:test@localhost:5432/crave_test
          DATABASE_URL_UNPOOLED=postgresql://test:test@localhost:5432/crave_test
          NEON_BRANCH=production
          NEON_BUCKET_UPLOADS=uploads
          WS_INTERNAL_SECRET=test-internal-secret-for-ci
          REDIS_URL=redis://localhost:6379
          WS_PORT=8000
          EOF

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=crave_test \
            -p 5432:5432 \
            postgres:16-alpine
          docker run -d --name redis-test \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for database readiness
        run: |
          for i in {1..30}; do
            if docker exec postgres-test pg_isready -U test -d crave_test; then
              echo "Database ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          for i in {1..10}; do
            if docker exec redis-test redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              break
            fi
            echo "Waiting for Redis... ($i/10)"
            sleep 1
          done

      - name: Push database schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test

      - name: Start application stack
        run: |
          docker compose up -d

      - name: Wait for application services readiness
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/health > /dev/null && curl -sf http://localhost:8000/__ws/broadcast > /dev/null; then
              echo "All services ready"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 3
          done

      - name: Run load test
        uses: grafana/k6-action@v0.2.0
        with:
          filename: load-tests/checkout-load-test.js
          env: BASE_URL=http://localhost:3000 WS_URL=ws://localhost:8000

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: load-test-results.json

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Next.js application
        run: pnpm build

  security-scan:
    # A4: Hard gate — fails the pipeline on any high/critical vulnerability in
    # production dependencies. Test-only (devDependencies) vulnerabilities are
    # reported but do not block the build; document accepted ones in
    # .audit-allowlist.json (array of npm advisory IDs, e.g. [1234567]).
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard fail: any high/critical in production deps blocks merge.
      # pnpm audit --prod scopes to production dependency graph only.
      - name: Audit production dependencies (HARD GATE — high/critical = fail)
        run: pnpm audit --prod --audit-level=high

      # Informational: dev deps reported but do not fail CI.
      # Output is uploaded as an artifact for triage.
      - name: Audit dev dependencies (informational only)
        run: pnpm audit --audit-level=high || true

      # Check for known-accepted advisories; fail if new unreviewed ones appear.
      # Allowlist lives in .audit-allowlist.json — an array of npm advisory IDs.
      - name: Verify no new unreviewed advisories (allowlist check)
        run: |
          ALLOWLIST=".audit-allowlist.json"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "[]" > "$ALLOWLIST"
          fi
          # Run audit and capture JSON output; exit 0 even on findings (we check manually)
          pnpm audit --prod --json > /tmp/audit-output.json 2>/dev/null || true
          # Extract advisory IDs found at high/critical severity
          FOUND=$(jq -r '
            (.advisories // {}) |
            to_entries[] |
            select(.value.severity == "high" or .value.severity == "critical") |
            .key
          ' /tmp/audit-output.json 2>/dev/null | sort || echo "")
          ALLOWED=$(jq -r '.[]' "$ALLOWLIST" 2>/dev/null | sort || echo "")
          # Any finding NOT in the allowlist is a new unreviewed vuln — hard fail
          NEW=$(comm -23 <(echo "$FOUND") <(echo "$ALLOWED"))
          if [ -n "$NEW" ]; then
            echo "❌ NEW unreviewed high/critical advisories found (not in $ALLOWLIST):"
            echo "$NEW"
            echo "Add to $ALLOWLIST only after security review and documented acceptance."
            exit 1
          fi
          echo "✅ All high/critical advisories are either absent or reviewed."

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true # Snyk is advisory; pnpm audit is the hard gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: /tmp/audit-output.json

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'crave'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: reports/

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, security-scan, dependency-scan, load-test]
    if: always()
    steps:
      - name: Print CI status
        run: |
          echo "CI Pipeline Results:"
          echo "  Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "  TypeCheck: ${{ needs.typecheck.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Security Scan: ${{ needs.security-scan.result }}"
          echo "  Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "  Load Test: ${{ needs.load-test.result }}"
          if [[ "${{ needs.lint-and-format.result }}" != "success" ]] ||
             [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]] ||
             [[ "${{ needs.security-scan.result }}" != "success" ]] ||
             [[ "${{ needs.dependency-scan.result }}" != "success" ]] ||
             [[ "${{ needs.load-test.result }}" != "success" ]]; then
            echo "❌ CI FAILED"
            exit 1
          else
            echo "✅ CI PASSED"
          fi
