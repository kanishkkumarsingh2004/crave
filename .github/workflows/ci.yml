name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '12.8.1'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: TypeScript check
        run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d crave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test

      - name: Run tests
        run: pnpm test
        env:
          ALLOW_DATABASE_TESTS: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/crave_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          WS_INTERNAL_SECRET: test-internal-secret

  load-test:
    name: Load & Concurrency Test
    runs-on: ubuntu-latest
    needs: [build]
    # Two kinds of check live in this job, with very different gating:
    #
    #   1. The k6 smoke load test (below) is a flaky performance experiment —
    #      it answers "how does it behave under traffic" and is allowed to
    #      fail without blocking the pipeline. It has continue-on-error: true.
    #
    #   2. The abuse / concurrency suite is a deterministic correctness gate —
    #      it answers "does the system stay correct when it is hammered" and
    #      runs with --fail-on integrity, so any data corruption (duplicate
    #      orders, oversold stock, replayed idempotency keys) fails the job.
    #      This step has NO continue-on-error and is a mandatory release gate.
    #
    # The job as a whole is therefore gated on concurrency correctness, not
    # on load-test flakiness.
    env:
      REDIS_URL: redis://localhost:6379
      SEED_PASSWORD: 'ci-${{ github.run_id }}-${{ github.run_attempt }}-A9x!'
      SEED_ADMIN_EMAIL: 'load-admin-${{ github.run_id }}@example.test'
      SEED_CUSTOMER_EMAIL: 'load-customer-${{ github.run_id }}@example.test'
      SEED_VENDOR_EMAIL: 'load-vendor-${{ github.run_id }}@example.test'
      SEED_STORE_EMAIL: 'load-store-${{ github.run_id }}@example.test'
      SEED_RIDER_EMAIL: 'load-rider-${{ github.run_id }}@example.test'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Create CI environment file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          JWT_SECRET=test-jwt-secret-for-ci-load-test
          DATABASE_URL=postgresql://test:test@localhost:5432/crave_test
          DATABASE_URL_UNPOOLED=postgresql://test:test@localhost:5432/crave_test
          NEON_BRANCH=production
          NEON_BUCKET_UPLOADS=uploads
          WS_INTERNAL_SECRET=test-internal-secret-for-ci
          REDIS_URL=redis://localhost:6379
          WS_PORT=8000
          EOF

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=crave_test \
            -p 5432:5432 \
            postgres:16-alpine
          docker run -d --name redis-test \
            -p 6379:6379 \
            redis:7-alpine

      - name: Wait for database readiness
        run: |
          db_ready=false
          for i in {1..30}; do
            if docker exec postgres-test pg_isready -U test -d crave_test; then
              echo "Database ready"
              db_ready=true
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          if [ "$db_ready" != "true" ]; then
            echo "❌ Database did not become ready after 30 attempts"
            echo "--- postgres-test container logs ---"
            docker logs --tail=50 postgres-test || true
            exit 1
          fi

          redis_ready=false
          for i in {1..10}; do
            if docker exec redis-test redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              redis_ready=true
              break
            fi
            echo "Waiting for Redis... ($i/10)"
            sleep 1
          done
          if [ "$redis_ready" != "true" ]; then
            echo "❌ Redis did not become ready after 10 attempts"
            echo "--- redis-test container logs ---"
            docker logs --tail=50 redis-test || true
            exit 1
          fi

      - name: Apply database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test

      - name: Seed load-test data
        run: pnpm db:seed:full

      - name: Build application
        run: pnpm build

      - name: Start application services
        run: |
          pnpm start > /tmp/crave-app.log 2>&1 &
          pnpm start:ws > /tmp/crave-ws.log 2>&1 &

      - name: Wait for application services readiness
        run: |
          services_ready=false
          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/health > /dev/null && curl -sf http://localhost:8000/health > /dev/null; then
              echo "All services ready"
              services_ready=true
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 3
          done
          if [ "$services_ready" != "true" ]; then
            echo "❌ Application services did not become ready after 60 attempts (180 s)"
            echo "--- application log (last 80 lines) ---"
            tail -80 /tmp/crave-app.log || true
            echo "--- websocket log (last 80 lines) ---"
            tail -80 /tmp/crave-ws.log || true
            exit 1
          fi

      - name: Run load test
        # Flaky performance experiment — non-blocking. Concurrency correctness
        # is gated by the abuse / concurrency suite below.
        continue-on-error: true
        uses: grafana/k6-action@55845c6c2e400af4356c84e5b514aeabb1bfdbd4 # v0.2.0
        with:
          filename: load-tests/app-load-test.js
          env: APP=all BASE_URL=http://localhost:3000 WS_URL=ws://localhost:8000 CI_SMOKE=true STRICT_AUTH=true SEED_ADMIN_EMAIL=${{ env.SEED_ADMIN_EMAIL }} SEED_CUSTOMER_EMAIL=${{ env.SEED_CUSTOMER_EMAIL }} SEED_VENDOR_EMAIL=${{ env.SEED_VENDOR_EMAIL }} SEED_RIDER_EMAIL=${{ env.SEED_RIDER_EMAIL }} SEED_PASSWORD=${{ env.SEED_PASSWORD }}

      - name: Upload load test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: load-test-results
          path: load-test-results.json

      - name: Install k6 for the abuse suite
        run: |
          K6_VERSION=1.2.0
          curl -sL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Create abuse suite environment
        run: |
          cat > load-tests/.env << 'EOF'
          SEED_CUSTOMER_EMAIL=${{ env.SEED_CUSTOMER_EMAIL }}
          SEED_ADMIN_EMAIL=${{ env.SEED_ADMIN_EMAIL }}
          SEED_VENDOR_EMAIL=${{ env.SEED_VENDOR_EMAIL }}
          SEED_RIDER_EMAIL=${{ env.SEED_RIDER_EMAIL }}
          SEED_PASSWORD=${{ env.SEED_PASSWORD }}
          EOF

      - name: Run abuse / concurrency suite
        run: |
          pnpm abuse-test -- \
            --url http://localhost:3000 \
            --ws-url ws://localhost:8000/api/ws \
            --env-file load-tests/.env \
            --reset-rate-limits \
            --fail-on integrity

      - name: Upload abuse test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: abuse-test-results
          path: load-tests/reports/

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/crave_test

      - name: Build Next.js application
        run: pnpm build

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d crave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: docker build --tag crave:ci --build-arg DATABASE_URL=postgresql://test:test@localhost:5432/crave_test .

      - name: Apply database migrations to service Postgres
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/crave_test
          DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/crave_test

      - name: Run Docker container
        run: |
          docker run -d --name crave-ci \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/crave_test \
            -e DATABASE_URL_UNPOOLED=postgresql://test:test@localhost:5432/crave_test \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=test-secret-for-ci \
            -e WS_INTERNAL_SECRET=test-internal-secret \
            -e WS_PORT=8000 \
            -p 3000:3000 \
            --network host \
            crave:ci

      - name: Wait for container readiness
        run: |
          ready=false
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Container is ready"
              ready=true
              break
            fi
            echo "Waiting for container... ($i/30)"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Container did not become ready"
            docker logs --tail=50 crave-ci || true
            exit 1
          fi

      - name: Smoke test health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          if [ "$code" != "200" ]; then
            echo "❌ Health endpoint returned $code, expected 200"
            exit 1
          fi
          echo "✅ Health endpoint returned 200"

      - name: Stop container
        if: always()
        run: |
          docker stop crave-ci 2>/dev/null || true
          docker rm crave-ci 2>/dev/null || true

  security-scan:
    # A4: Hard gate — fails the pipeline on any high/critical vulnerability in
    # production dependencies. Test-only (devDependencies) vulnerabilities are
    # reported but do not block the build; document accepted ones in
    # .audit-allowlist.json (array of npm advisory IDs, e.g. [1234567]).
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard fail: any high/critical in production deps blocks merge.
      # pnpm audit --prod scopes to production dependency graph only.
      - name: Audit production dependencies (HARD GATE — high/critical = fail)
        run: pnpm audit --prod --audit-level=high

      # Informational: dev deps reported but do not fail CI.
      # Output is uploaded as an artifact for triage.
      - name: Audit dev dependencies (informational only)
        run: pnpm audit --audit-level=high || true

      # Check for known-accepted advisories; fail if new unreviewed ones appear.
      # Allowlist lives in .audit-allowlist.json — an array of npm advisory IDs.
      - name: Verify no new unreviewed advisories (allowlist check)
        run: |
          ALLOWLIST=".audit-allowlist.json"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "[]" > "$ALLOWLIST"
          fi
          # Run audit and capture JSON output; exit 0 even on findings (we check manually)
          pnpm audit --prod --json > /tmp/audit-output.json 2>/dev/null || true
          # Extract advisory IDs found at high/critical severity
          FOUND=$(jq -r '
            (.advisories // {}) |
            to_entries[] |
            select(.value.severity == "high" or .value.severity == "critical") |
            .key
          ' /tmp/audit-output.json 2>/dev/null | sort || echo "")
          ALLOWED=$(jq -r '.[]' "$ALLOWLIST" 2>/dev/null | sort || echo "")
          # Any finding NOT in the allowlist is a new unreviewed vuln — hard fail
          NEW=$(comm -23 <(echo "$FOUND") <(echo "$ALLOWED"))
          if [ -n "$NEW" ]; then
            echo "❌ NEW unreviewed high/critical advisories found (not in $ALLOWLIST):"
            echo "$NEW"
            echo "Add to $ALLOWLIST only after security review and documented acceptance."
            exit 1
          fi
          echo "✅ All high/critical advisories are either absent or reviewed."

      - name: Run Snyk security scan
        uses: snyk/actions/node@b98d498629f1c368650224d6d212bf7dfa89e4bf # 0.4.0
        continue-on-error: true # Snyk is advisory; pnpm audit is the hard gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-report
          path: /tmp/audit-output.json

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # Advisory scan only — OWASP dependency-check is slow and flaky in CI.
    # Security Scan (pnpm audit --prod --audit-level=high) is the hard gate.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # reviewed main
        with:
          project: 'crave'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload OWASP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: owasp-dependency-report
          path: reports/

  deploy:
    name: Deploy Production
    # Opt-in. Set the RENDER_DEPLOY_HOOK repository secret to the deploy hook
    # of the Render service (Service → Deploys → Deploy Hook). Without it this
    # job leaves production untouched and only reports the missing secret.
    runs-on: ubuntu-latest
    needs: [build, docker-build, load-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy production
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set — production was left untouched."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered."

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, typecheck, test, build, docker-build, security-scan, dependency-scan, load-test]
    if: always()
    steps:
      - name: Print CI status
        run: |
          echo "CI Pipeline Results:"
          echo "  Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "  TypeCheck: ${{ needs.typecheck.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Docker Build: ${{ needs.docker-build.result }}"
          echo "  Security Scan: ${{ needs.security-scan.result }}"
          echo "  Dependency Scan (advisory): ${{ needs.dependency-scan.result }}"
          echo "  Load & Concurrency Test: ${{ needs.load-test.result }}"
          if [[ "${{ needs.lint-and-format.result }}" != "success" ]] ||
             [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]] ||
             [[ "${{ needs.docker-build.result }}" != "success" ]] ||
             [[ "${{ needs.security-scan.result }}" != "success" ]] ||
             [[ "${{ needs.load-test.result }}" != "success" ]]; then
            echo "❌ CI FAILED"
            exit 1
          else
            echo "✅ CI PASSED"
          fi
